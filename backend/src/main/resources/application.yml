spring:
  # Varias tareas programadas (alertas, colectivos, Metrovias, clima...): con un
  # solo hilo, una lenta (el feed de colectivos) demoraba a todas las demas.
  task:
    scheduling:
      pool:
        size: 3
  application:
    name: ba-transit-backend
  datasource:
    # sslmode=prefer: intenta SSL primero (lo que exige Neon en produccion)
    # y si no esta disponible, sigue sin el (como el Postgres local de Docker).
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:batransit}?sslmode=prefer
    username: ${DB_USER:batransit}
    password: ${DB_PASSWORD:batransit}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

server:
  # Render inyecta la variable PORT automaticamente. En local no existe,
  # asi que cae a SERVER_PORT (si la seteaste) y despues a 8080.
  port: ${PORT:${SERVER_PORT:8080}}
  # Menos hilos de Tomcat (200 por defecto): cada uno reserva memoria para
  # su pila, y para el trafico del sitio con 40 sobra.
  tomcat:
    threads:
      max: 40

transporte:
  api:
    base-url: https://apitransporte.buenosaires.gob.ar
    client-id: ${TRANSPORTE_CLIENT_ID:}
    client-secret: ${TRANSPORTE_CLIENT_SECRET:}

app:
  frontend-origins: ${FRONTEND_ORIGINS:http://localhost:5173}
  # Clave para los endpoints de escritura (POST). Vacia = escritura
  # deshabilitada. Ver AdminApiKeyFilter.
  admin-api-key: ${ADMIN_API_KEY:}
  colectivos:
    # Feed GTFS de colectivos. Vacio = API Transporte (gtfs-path) con las
    # mismas credenciales que las alertas. Se puede apuntar a otra URL.
    gtfs-url: ${COLECTIVOS_GTFS_URL:}
    gtfs-path: ${COLECTIVOS_GTFS_PATH:/colectivos/feed-gtfs}
  tomtom:
    # Clave de la API de trafico de TomTom (plan gratuito). Vacia = el
    # apartado Accesos muestra la informacion fija sin estado en vivo.
    api-key: ${TOMTOM_API_KEY:}
  auth:
    # Clave con la que se firman las sesiones (32 caracteres o mas; en
    # Render, "Generate"). Vacia = clave temporal: las sesiones se pierden
    # al reiniciar el servidor.
    token-secret: ${AUTH_TOKEN_SECRET:}
    # ID de cliente de Google (publico). Vacio = sin "Continuar con Google".
    google-client-id: ${GOOGLE_CLIENT_ID:}
  opensky:
    # Cliente de la API de OpenSky Network (cuenta gratuita). Vacio = se
    # consulta sin cuenta, con menos actualizaciones por dia.
    client-id: ${OPENSKY_CLIENT_ID:}
    client-secret: ${OPENSKY_CLIENT_SECRET:}
