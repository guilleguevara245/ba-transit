<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0c0d" />
    <title>Sin conexión · BA Transit</title>
    <style>
      :root { color-scheme: light dark; --bg: #f4f3ef; --surface: #fff; --text: #17171a; --dim: #55534e; --yellow: #f4c11b; }
      @media (prefers-color-scheme: dark) { :root { --bg: #111113; --surface: #1b1b1e; --text: #f1f0ea; --dim: #aeaca5; } }
      * { box-sizing: border-box; margin: 0; }
      body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text);
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; }
      main { max-width: 380px; padding: 28px 24px; background: var(--surface); text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
      svg { width: 56px; height: 56px; margin-bottom: 14px; }
      h1 { font-size: 24px; margin-bottom: 8px; }
      p { color: var(--dim); font-size: 14px; line-height: 1.5; }
      button { margin-top: 18px; padding: 10px 18px; border: none; background: var(--yellow); color: #17171a; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="6" fill="#f4c11b" />
        <g fill="#0c0c0d">
          <polygon points="9,15 17,15 28,32 17,49 9,49 20,32" />
          <polygon points="23,15 31,15 42,32 31,49 23,49 34,32" />
          <polygon points="37,15 45,15 56,32 45,49 37,49 48,32" />
        </g>
      </svg>
      <h1>Sin conexión</h1>
      <p>BA Transit necesita internet para mostrar el estado del transporte en vivo. Revisá tu conexión y probá de nuevo.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
