<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0c0c0d" />
    <meta name="apple-mobile-web-app-title" content="BA Transit" />
    <title>BA Transit</title>
    <!-- Fuentes: con link (y no @import en el CSS) se descargan en paralelo
         con el resto y no demoran la primera pintura. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700&display=swap"
    />
    <meta name="description" content="El transporte de Buenos Aires en un solo lugar. Subte, trenes y colectivos en vivo, cómo llegar, EcoBici, estacionamiento, accesos y aeropuertos de Buenos Aires." />

    <!-- Vista previa al compartir el enlace (WhatsApp, redes). La imagen
         necesita una URL absoluta: si cambia el dominio, actualizarla. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BA Transit" />
    <meta property="og:title" content="BA Transit · El transporte de Buenos Aires en un solo lugar" />
    <meta property="og:description" content="Subte, trenes y colectivos en vivo, cómo llegar, EcoBici, estacionamiento, accesos y aeropuertos de Buenos Aires." />
    <meta property="og:url" content="https://ba-transit.onrender.com/" />
    <!-- ?v=2: WhatsApp y las redes guardan la imagen; al cambiarla, subir el numero. -->
    <meta property="og:image" content="https://ba-transit.onrender.com/og-image.png?v=2" />
    <meta property="og:image:alt" content="BA Transit: el transporte de Buenos Aires en un solo lugar" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_AR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BA Transit · El transporte de Buenos Aires en un solo lugar" />
    <meta name="twitter:description" content="Subte, trenes y colectivos en vivo, cómo llegar, EcoBici, estacionamiento, accesos y aeropuertos de Buenos Aires." />
    <meta name="twitter:image" content="https://ba-transit.onrender.com/og-image.png?v=2" />
    <script>
      // Tema antes de que cargue la app, para que no parpadee: lo guardado
      // en este navegador o, si no hay nada, la preferencia del sistema.
      try {
        var tema = localStorage.getItem('ba-transit-tema')
        if (!tema && window.matchMedia('(prefers-color-scheme: dark)').matches) tema = 'dark'
        document.documentElement.dataset.theme = tema === 'dark' ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
