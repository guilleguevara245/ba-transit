<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0c0c0d" />
    <meta name="apple-mobile-web-app-title" content="BA Transit" />
    <title>BA Transit</title>
    <meta name="description" content="Estado del transporte de Buenos Aires en un solo lugar: subte, Premetro, trenes, colectivos, accesos y aeropuertos." />

    <!-- Vista previa al compartir el enlace (WhatsApp, redes). La imagen
         necesita una URL absoluta: si cambia el dominio, actualizarla. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BA Transit" />
    <meta property="og:title" content="BA Transit" />
    <meta property="og:description" content="Estado del transporte de Buenos Aires: subte, Premetro, trenes, colectivos, accesos y aeropuertos." />
    <meta property="og:image" content="https://ba-transit.onrender.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_AR" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Tema antes de que cargue la app, para que no parpadee: lo guardado
      // en este navegador o, si no hay nada, la preferencia del sistema.
      try {
        var tema = localStorage.getItem('ba-transit-tema')
        if (!tema && window.matchMedia('(prefers-color-scheme: dark)').matches) tema = 'dark'
        document.documentElement.dataset.theme = tema === 'dark' ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
